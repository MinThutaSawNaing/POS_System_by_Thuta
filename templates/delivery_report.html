<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/public/photos/logo.ico" type="image/x-icon" />
    <title>Delivery Performance Report</title>
    <link href="/public/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/public/vendor/bootstrap-icons/bootstrap-icons.css" />
    <style>
      body { background: #f4f6f9; }
      .kpi-card small { font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-3">
      <div class="container-fluid flex-wrap gap-2">
        <span class="navbar-brand mb-0"><i class="bi bi-graph-up-arrow me-2"></i>Delivery Performance Report</span>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <input type="date" id="report-from" class="form-control form-control-sm" style="width: auto;" title="From date" />
          <input type="date" id="report-to" class="form-control form-control-sm" style="width: auto;" title="To date" />
          <button type="button" id="load-button" class="btn btn-sm btn-primary" title="Reload the report for the selected range">
            <i class="bi bi-arrow-repeat"></i> Load
          </button>
          {% if can_export %}
            <button type="button" id="export-pdf" class="btn btn-sm btn-outline-danger" title="Download the delivery performance report as a PDF">
              <i class="bi bi-file-earmark-pdf"></i> PDF
            </button>
            <button type="button" id="export-xlsx" class="btn btn-sm btn-outline-success" title="Download the delivery performance report as an Excel workbook">
              <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
          {% endif %}
          <button type="button" class="btn btn-sm btn-outline-light" onclick="window.close()" title="Close this window">
            <i class="bi bi-x-lg"></i> Close
          </button>
        </div>
      </div>
    </nav>
    <main class="container-fluid px-3 pb-4" id="report-root">
      <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("report-root");
        const REPORT_USER_ID = {{ session.get('user_id') | tojson }};
        const REPORT_USER_ROLE = {{ session.get('role') | tojson }};
        const identityHeaders = {
          "X-POS-User-ID": String(REPORT_USER_ID),
          "X-POS-Role": String(REPORT_USER_ROLE),
        };
        let sessionStale = false;

        function blockStaleReport() {
          sessionStale = true;
          root.innerHTML = '<div class="alert alert-warning">This report belongs to a different sign-in. Reload or sign in again.</div>';
          for (const id of ["load-button", "export-pdf", "export-xlsx"]) {
            const button = document.getElementById(id);
            if (button) button.disabled = true;
          }
        }

        function escapeHtml(unsafe) {
          return String(unsafe === null || unsafe === undefined ? "" : unsafe)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function formatHours(value) {
          return value === null || value === undefined ? "—" : `${Number(value).toFixed(1)} h`;
        }

        function ensureDefaults() {
          const fromInput = document.getElementById("report-from");
          const toInput = document.getElementById("report-to");
          if (!toInput.value) toInput.value = new Date().toISOString().slice(0, 10);
          if (!fromInput.value) {
            const from = new Date();
            from.setDate(from.getDate() - 30);
            fromInput.value = from.toISOString().slice(0, 10);
          }
        }

        function dateParams() {
          const params = new URLSearchParams();
          const from = document.getElementById("report-from").value.trim();
          const to = document.getElementById("report-to").value.trim();
          if (from) params.set("date_from", from);
          if (to) params.set("date_to", to);
          return params;
        }

        async function loadReport() {
          if (sessionStale) return;
          ensureDefaults();
          root.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';
          try {
            const response = await fetch(`/api/deliveries/report?${dateParams().toString()}`, {
              cache: "no-store", headers: identityHeaders,
            });
            if (response.status === 409 && response.headers.get("X-POS-Session-Mismatch") === "1") {
              blockStaleReport();
              return;
            }
            const data = await response.json();
            if (sessionStale) return;
            if (!response.ok || !data.kpis) {
              throw new Error(data.message || data.error || "Failed to load the delivery report.");
            }
            render(data);
          } catch (error) {
            console.error("Error loading delivery report", error);
            root.innerHTML = `<p class="text-danger mb-0">${escapeHtml(error.message || "Failed to load the delivery report.")}</p>`;
          }
        }

        function render(data) {
          const k = data.kpis || {};
          const percent = (value) => (value === null || value === undefined ? "—" : `${Number(value).toFixed(0)}%`);
          const kpiCards = [
            { label: "Deliveries", value: k.total ?? 0, cls: "" },
            { label: "Delivered", value: k.delivered ?? 0, cls: "text-success" },
            { label: "In progress", value: k.open ?? 0, cls: "text-primary" },
            { label: "Overdue (&gt;24h)", value: k.overdue ?? 0, cls: "text-danger" },
            { label: "Cancelled", value: k.cancelled ?? 0, cls: "text-secondary" },
            { label: "Completion", value: percent(k.completion_rate), cls: "" },
            { label: "On-time (≤24h)", value: percent(k.on_time_rate), cls: "" },
            { label: "Avg time to deliver", value: formatHours(k.avg_fulfillment_hours), cls: "" },
            { label: "Avg packing time", value: formatHours(k.avg_packing_hours), cls: "" },
            { label: "Avg dispatch time", value: formatHours(k.avg_dispatch_hours), cls: "" },
            { label: "Avg final leg", value: formatHours(k.avg_final_leg_hours), cls: "" },
            { label: "Avg open age", value: formatHours(k.avg_open_age_hours), cls: "" },
          ];
          const courierRows = (data.courier_performance || []).map((c) => `
            <tr>
              <td>${escapeHtml(c.courier_name || "-")}</td>
              <td class="text-end">${c.assigned ?? 0}</td>
              <td class="text-end">${c.delivered ?? 0}</td>
              <td class="text-end">${c.open ?? 0}</td>
              <td class="text-end ${c.overdue > 0 ? "text-danger fw-semibold" : ""}">${c.overdue ?? 0}</td>
              <td class="text-end">${formatHours(c.avg_fulfillment_hours)}</td>
            </tr>`).join("");
          const attentionRows = (data.attention || []).map((d) => `
            <tr>
              <td>${escapeHtml(d.delivery_number || "-")}</td>
              <td>${escapeHtml(d.recipient_name || "-")}<br /><small class="text-muted">${escapeHtml(d.recipient_phone || "")}</small></td>
              <td>${escapeHtml(d.township || "-")}</td>
              <td><span class="badge bg-info">${escapeHtml(d.stage_label || d.stage || "-")}</span></td>
              <td>${escapeHtml(d.priority || "-")}</td>
              <td>${escapeHtml(d.courier_name || "-")}</td>
              <td class="${d.timing_flag === "Overdue" ? "text-danger fw-semibold" : ""}">${formatHours(d.age_hours)}</td>
              <td>${d.timing_flag === "Overdue" ? '<span class="badge bg-danger">Overdue</span>' : '<span class="badge bg-success">On track</span>'}</td>
            </tr>`).join("");
          root.innerHTML = `
            <div class="row g-2 mb-3">
              ${kpiCards.map((c) => `
                <div class="col-6 col-md-4 col-xl-2">
                  <div class="card bg-white kpi-card shadow-sm"><div class="card-body py-2">
                    <small class="text-muted d-block">${c.label}</small>
                    <h5 class="mb-0 fs-6 ${c.cls}">${c.value}</h5>
                  </div></div>
                </div>`).join("")}
            </div>
            <div class="row g-3">
              <div class="col-12 col-lg-5">
                <div class="card shadow-sm"><div class="card-body">
                  <h6 class="text-muted"><i class="bi bi-person-badge me-1"></i>Courier performance</h6>
                  <div class="table-responsive">
                    <table class="table table-sm table-striped align-middle">
                      <thead><tr><th>Courier</th><th class="text-end">Assigned</th><th class="text-end">Delivered</th><th class="text-end">Open</th><th class="text-end">Overdue</th><th class="text-end">Avg time</th></tr></thead>
                      <tbody>${courierRows || '<tr><td colspan="6" class="text-muted text-center">No deliveries in range</td></tr>'}</tbody>
                    </table>
                  </div>
                </div></div>
              </div>
              <div class="col-12 col-lg-7">
                <div class="card shadow-sm"><div class="card-body">
                  <h6 class="text-muted"><i class="bi bi-exclamation-triangle me-1"></i>Needs attention (open, oldest first)</h6>
                  <div class="table-responsive">
                    <table class="table table-sm table-striped align-middle">
                      <thead><tr><th>Delivery #</th><th>Recipient</th><th>Township</th><th>Stage</th><th>Priority</th><th>Courier</th><th>Open age</th><th>Timing</th></tr></thead>
                      <tbody>${attentionRows || '<tr><td colspan="8" class="text-muted text-center">Nothing open — all clear</td></tr>'}</tbody>
                    </table>
                  </div>
                </div></div>
              </div>
            </div>`;
        }

        function exportReport(format) {
          if (sessionStale) return;
          ensureDefaults();
          const params = dateParams();
          params.set("pos_user_id", String(REPORT_USER_ID));
          params.set("pos_role", String(REPORT_USER_ROLE));
          params.set("format", format === "xlsx" ? "xlsx" : "pdf");
          const exportWindow = window.open(`/api/deliveries/export?${params.toString()}`, "_blank");
          if (!exportWindow) {
            root.insertAdjacentHTML("afterbegin",
              '<div class="alert alert-warning">Download window was blocked. Allow popups for this POS and try again.</div>');
          }
        }

        document.getElementById("load-button").addEventListener("click", loadReport);
        const pdfButton = document.getElementById("export-pdf");
        if (pdfButton) pdfButton.addEventListener("click", () => exportReport("pdf"));
        const xlsxButton = document.getElementById("export-xlsx");
        if (xlsxButton) xlsxButton.addEventListener("click", () => exportReport("xlsx"));

        loadReport();
      })();
    </script>
  </body>
</html>
