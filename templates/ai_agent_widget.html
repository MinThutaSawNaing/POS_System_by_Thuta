<!-- Loli AI Assistant: self-contained dashboard widget -->
<style>
  .loli-widget {
    --loli-ink: #121826; --loli-surface: #1c2638; --loli-surface-raised: #26344b; --loli-border: #31415b;
    --loli-signal: #5e7cff; --loli-signal-light: #8fa2ff; --loli-mint: #4fd1b5; --loli-paper: #f7f9fc;
    --loli-muted: #a8b4c7; --loli-danger: #ff7185;
    position: fixed; right: 24px; bottom: 24px; z-index: 9999;
    font-family: 'Padauk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .loli-widget *, .loli-widget *::before, .loli-widget *::after { box-sizing: border-box; }
  .loli-widget button, .loli-widget textarea { font: inherit; }
  .loli-widget button { -webkit-tap-highlight-color: transparent; }
  .loli-widget button:focus-visible, .loli-widget textarea:focus-visible { outline: 3px solid var(--loli-mint); outline-offset: 3px; }
  .loli-launcher { min-height: 60px; padding: 4px 18px 4px 5px; border: 1px solid rgba(143,162,255,.55); border-radius: 999px; background: var(--loli-ink); color: var(--loli-paper); box-shadow: 0 16px 38px rgba(18,24,38,.3); cursor: pointer; display: inline-flex; align-items: center; gap: 11px; transition: transform .24s ease, box-shadow .24s ease, opacity .2s ease; }
  .loli-launcher:hover { transform: translateY(-3px); box-shadow: 0 20px 46px rgba(18,24,38,.42); }
  .loli-launcher[aria-expanded='true'] { opacity: 0; pointer-events: none; transform: scale(.94); }
  .loli-launcher__avatar, .loli-avatar { overflow: hidden; border-radius: 50%; background: var(--loli-surface-raised); flex: 0 0 auto; }
  .loli-launcher__avatar { width: 50px; height: 50px; border: 2px solid var(--loli-mint); }
  .loli-launcher__avatar img, .loli-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .loli-launcher__copy { display: grid; text-align: left; line-height: 1.1; }.loli-launcher__eyebrow { color: var(--loli-mint); font-size: 10px; font-weight: 700; letter-spacing: .1em; }.loli-launcher__label { font-size: 15px; font-weight: 700; }
  .loli-panel { position: absolute; right: 0; bottom: 0; width: min(440px,calc(100vw - 32px)); height: min(680px,calc(100dvh - 48px)); border: 1px solid rgba(143,162,255,.4); border-radius: 26px; background: var(--loli-ink); box-shadow: 0 28px 70px rgba(9,15,28,.42); color: var(--loli-paper); display: flex; flex-direction: column; overflow: hidden; opacity: 0; pointer-events: none; transform: translateY(16px) scale(.96); transform-origin: right bottom; transition: opacity .26s ease, transform .3s cubic-bezier(.2,.8,.2,1); }
  .loli-panel.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .loli-status { min-height: 29px; padding: 0 18px; background: #172136; display: flex; align-items: center; gap: 7px; color: var(--loli-muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; }.loli-status__beacon { width: 7px; height: 7px; border-radius: 50%; background: var(--loli-mint); box-shadow: 0 0 0 4px rgba(79,209,181,.1); }
  .loli-header { padding: 16px 18px 15px; border-bottom: 1px solid var(--loli-border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }.loli-header__identity { min-width: 0; display: flex; align-items: center; gap: 11px; }.loli-avatar { width: 40px; height: 40px; border: 1px solid rgba(79,209,181,.6); }.loli-header h2 { margin: 0; color: var(--loli-paper); font-size: 17px; font-weight: 700; line-height: 1.2; }.loli-header p { margin: 1px 0 0; color: var(--loli-muted); font-size: 11px; line-height: 1.25; }.loli-header__actions { display: flex; gap: 5px; }
  .loli-icon-button { width: 34px; height: 34px; padding: 0; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--loli-muted); display: grid; place-items: center; cursor: pointer; transition: color .2s ease, background .2s ease, border-color .2s ease; }.loli-icon-button:hover { color: var(--loli-paper); border-color: var(--loli-border); background: var(--loli-surface); }.loli-icon-button svg { width: 18px; height: 18px; }
  .loli-error { display: none; margin: 12px 16px 0; padding: 10px 12px; border: 1px solid rgba(255,113,133,.45); border-radius: 12px; background: rgba(255,113,133,.1); color: #ffd5db; font-size: 12px; line-height: 1.4; }.loli-error.is-visible { display: flex; align-items: flex-start; gap: 8px; }.loli-error svg { width: 16px; flex: 0 0 auto; margin-top: 1px; color: var(--loli-danger); }
  .loli-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth; }.loli-messages::-webkit-scrollbar { width: 6px; }.loli-messages::-webkit-scrollbar-thumb { border-radius: 99px; background: var(--loli-border); }
  .loli-welcome { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }.loli-welcome__mark { width: 62px; height: 62px; padding: 4px; margin-bottom: 20px; border: 1px solid rgba(79,209,181,.55); border-radius: 20px; background: var(--loli-surface); }.loli-welcome__mark img { display: block; width: 100%; height: 100%; border-radius: 15px; object-fit: cover; }.loli-welcome h3 { max-width: 300px; margin: 0 0 7px; font-size: 25px; line-height: 1.15; letter-spacing: -.03em; }.loli-welcome p { max-width: 350px; margin: 0 0 21px; color: var(--loli-muted); font-size: 13px; line-height: 1.55; }
  .loli-prompt-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }.loli-prompt { min-height: 72px; padding: 11px; border: 1px solid var(--loli-border); border-radius: 14px; background: var(--loli-surface); color: var(--loli-paper); cursor: pointer; text-align: left; font-size: 12px; font-weight: 700; line-height: 1.25; transition: border-color .2s ease, background .2s ease, transform .2s ease; }.loli-prompt:hover { border-color: var(--loli-signal-light); background: var(--loli-surface-raised); transform: translateY(-1px); }.loli-prompt__icon { display: block; width: 18px; height: 18px; margin-bottom: 7px; color: var(--loli-mint); }
  .loli-message { display: flex; margin-bottom: 17px; animation: loli-message-in .22s ease both; }.loli-message--user { justify-content: flex-end; }.loli-message__group { max-width: 86%; display: flex; align-items: flex-end; gap: 8px; }.loli-message--user .loli-message__group { flex-direction: row-reverse; }.loli-message__avatar { width: 27px; height: 27px; overflow: hidden; border: 1px solid rgba(79,209,181,.5); border-radius: 50%; flex: 0 0 auto; }.loli-message__avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }.loli-message__bubble { padding: 11px 13px; border-radius: 15px; color: var(--loli-paper); font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }.loli-message--assistant .loli-message__bubble { border: 1px solid var(--loli-border); border-bottom-left-radius: 4px; background: var(--loli-surface); }.loli-message--user .loli-message__bubble { border-bottom-right-radius: 4px; background: var(--loli-signal); }.loli-message__time { padding: 4px 2px 0; color: var(--loli-muted); font-size: 10px; }.loli-message--user .loli-message__time { text-align: right; } @keyframes loli-message-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  .loli-typing { display: none; padding: 0 16px 13px; }.loli-typing.is-visible { display: flex; align-items: center; gap: 8px; }.loli-typing__dots { display: flex; gap: 4px; padding: 10px 11px; border: 1px solid var(--loli-border); border-radius: 13px; background: var(--loli-surface); }.loli-typing__dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--loli-mint); animation: loli-typing 1.2s infinite ease-in-out; }.loli-typing__dots span:nth-child(2) { animation-delay: .15s; }.loli-typing__dots span:nth-child(3) { animation-delay: .3s; }.loli-typing__label { color: var(--loli-muted); font-size: 11px; } @keyframes loli-typing { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  .loli-suggestions { display: flex; gap: 7px; padding: 9px 16px; overflow-x: auto; border-top: 1px solid var(--loli-border); background: rgba(28,38,56,.45); scrollbar-width: none; }.loli-suggestions::-webkit-scrollbar { display: none; }.loli-suggestion { flex: 0 0 auto; padding: 6px 10px; border: 1px solid var(--loli-border); border-radius: 99px; background: transparent; color: var(--loli-muted); cursor: pointer; font-size: 11px; transition: color .2s, border-color .2s, background .2s; }.loli-suggestion:hover { border-color: var(--loli-signal-light); background: var(--loli-surface); color: var(--loli-paper); }
  .loli-composer { padding: 12px 16px max(14px,env(safe-area-inset-bottom)); border-top: 1px solid var(--loli-border); background: var(--loli-ink); }.loli-composer__shell { display: flex; align-items: flex-end; gap: 8px; padding: 5px 5px 5px 13px; border: 1px solid var(--loli-border); border-radius: 17px; background: var(--loli-surface); transition: border-color .2s, box-shadow .2s; }.loli-composer__shell:focus-within { border-color: var(--loli-signal-light); box-shadow: 0 0 0 3px rgba(94,124,255,.16); }.loli-composer textarea { min-width: 0; width: 100%; max-height: 120px; padding: 7px 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--loli-paper); font-size: 13px; line-height: 1.45; }.loli-composer textarea::placeholder { color: #7e8da5; }.loli-send { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 12px; background: var(--loli-signal); color: white; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; transition: transform .2s, background .2s; }.loli-send:hover:not(:disabled) { background: var(--loli-signal-light); transform: scale(1.05); }.loli-send:disabled { cursor: not-allowed; opacity: .45; }.loli-send svg { width: 17px; height: 17px; }.loli-composer__hint { display: block; margin: 7px 3px 0; color: #7e8da5; font-size: 10px; }
  .loli-confirm { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(8,13,23,.74); backdrop-filter: blur(4px); }.loli-confirm.is-visible { display: flex; }.loli-confirm__card { width: 100%; max-width: 310px; padding: 20px; border: 1px solid var(--loli-border); border-radius: 18px; background: var(--loli-surface); box-shadow: 0 20px 50px rgba(0,0,0,.3); }.loli-confirm h3 { margin: 0 0 6px; font-size: 17px; }.loli-confirm p { margin: 0; color: var(--loli-muted); font-size: 12px; line-height: 1.5; }.loli-confirm__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }.loli-confirm__actions button { min-height: 34px; padding: 0 12px; border-radius: 9px; cursor: pointer; font-size: 12px; font-weight: 700; }.loli-confirm__cancel { border: 1px solid var(--loli-border); background: transparent; color: var(--loli-paper); }.loli-confirm__delete { border: 1px solid transparent; background: var(--loli-danger); color: #2d0710; }
  @media (max-width: 640px) { .loli-widget { right: 16px; bottom: 16px; }.loli-launcher { width: 56px; height: 56px; min-height: 56px; padding: 3px; border-radius: 50%; justify-content: center; }.loli-launcher__avatar { width: 48px; height: 48px; }.loli-launcher__copy { display: none; }.loli-panel { position: fixed; inset: 0; width: 100vw; height: 100dvh; border: 0; border-radius: 0; transform: translateY(18px); transform-origin: center bottom; }.loli-panel.is-open { transform: translateY(0); }.loli-status { padding-left: 16px; }.loli-header { padding: 13px 16px; }.loli-messages { padding: 17px 14px; }.loli-composer, .loli-suggestions { padding-right: 14px; padding-left: 14px; } }
  @media (prefers-reduced-motion: reduce) { .loli-widget *, .loli-widget *::before, .loli-widget *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<aside class="loli-widget" aria-label="Loli AI assistant">
  <button class="loli-launcher" id="loliLauncher" type="button" aria-label="Open Loli assistant" aria-expanded="false" aria-controls="loliPanel"><span class="loli-launcher__avatar"><img src="/public/photos/loli-logo.png" alt=""></span><span class="loli-launcher__copy"><span class="loli-launcher__eyebrow">LIVE OPERATIONS</span><span class="loli-launcher__label">Ask Loli</span></span></button>
  <section class="loli-panel" id="loliPanel" aria-labelledby="loliTitle" aria-hidden="true">
    <div class="loli-status"><span class="loli-status__beacon"></span>LOLI · LIVE OPERATIONS</div>
    <header class="loli-header"><div class="loli-header__identity"><span class="loli-avatar"><img src="/public/photos/loli-logo.png" alt="Loli AI"></span><div><h2 id="loliTitle">Loli</h2><p>Inventory &amp; procurement assistant</p></div></div><div class="loli-header__actions"><button class="loli-icon-button" id="loliClearButton" type="button" aria-label="Clear conversation" title="Clear conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-7 0 1 14h4l1-14"/></svg></button><button class="loli-icon-button" id="loliCloseButton" type="button" aria-label="Close Loli assistant" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header>
    <div class="loli-error" id="loliError" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg><span id="loliErrorText"></span></div>
    <main class="loli-messages" id="loliMessages" aria-live="polite" aria-relevant="additions"></main>
    <div class="loli-typing" id="loliTyping" aria-live="polite"><span class="loli-typing__dots" aria-hidden="true"><span></span><span></span><span></span></span><span class="loli-typing__label">Loli is checking live data…</span></div>
    <div class="loli-suggestions" aria-label="Suggested questions"><button class="loli-suggestion" type="button" data-command="What products need reordering?">Products to reorder</button><button class="loli-suggestion" type="button" data-command="Show pending purchase orders">Pending orders</button><button class="loli-suggestion" type="button" data-command="Show me sales trends for last 30 days">Sales trends</button></div>
    <form class="loli-composer" id="loliComposer"><div class="loli-composer__shell"><textarea id="loliInput" rows="1" maxlength="4000" placeholder="Ask about inventory or operations…" aria-label="Message Loli"></textarea><button class="loli-send" id="loliSendButton" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><small class="loli-composer__hint">Enter to send · Shift + Enter for a new line</small></form>
    <div class="loli-confirm" id="loliClearConfirm" role="dialog" aria-modal="true" aria-labelledby="loliConfirmTitle" aria-hidden="true"><div class="loli-confirm__card"><h3 id="loliConfirmTitle">Clear this conversation?</h3><p>This removes Loli’s saved context for your account. This cannot be undone.</p><div class="loli-confirm__actions"><button class="loli-confirm__cancel" id="loliCancelClear" type="button">Keep chat</button><button class="loli-confirm__delete" id="loliConfirmClear" type="button">Clear chat</button></div></div></div>
  </section>
</aside>

<script>
(() => {
  const commands = [['Review low stock','Check low stock items','M4 7h16M4 12h16M4 17h10'],['Check pending orders','Show pending purchase orders','M7 3h8l4 4v14H7zM15 3v5h5M10 12h6m-6 4h6'],['View warehouse inventory','Get warehouse inventory','M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6'],['Analyse recent sales','Show me sales trends for last 30 days','M4 19V5m0 14h16M8 15l3-3 3 2 5-6']];
  const $ = (id) => document.getElementById(id), launcher = $('loliLauncher'), panel = $('loliPanel'), input = $('loliInput'), messages = $('loliMessages'), sendButton = $('loliSendButton'), typing = $('loliTyping'), error = $('loliError'), errorText = $('loliErrorText'), clearModal = $('loliClearConfirm'), clearButton = $('loliClearButton'), cancelClear = $('loliCancelClear'), confirmClear = $('loliConfirmClear');
  let open = false, processing = false;
  function icon(path) { return `<svg class="loli-prompt__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${path}"/></svg>`; }
  function welcome() { messages.replaceChildren(); const screen = document.createElement('section'); screen.className = 'loli-welcome'; screen.id = 'loliWelcome'; screen.innerHTML = `<div class="loli-welcome__mark"><img src="/public/photos/loli-logo.png" alt="Loli AI"></div><h3>What needs attention?</h3><p>Ask Loli about stock, suppliers, purchase orders, warehouse activity, or sales.</p><div class="loli-prompt-grid"></div>`; const grid = screen.querySelector('.loli-prompt-grid'); commands.forEach(([label,command,path]) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'loli-prompt'; button.dataset.command = command; button.innerHTML = `${icon(path)}${label}`; grid.appendChild(button); }); messages.appendChild(screen); }
  function setOpen(next) { open = next; panel.classList.toggle('is-open',next); panel.setAttribute('aria-hidden',String(!next)); launcher.setAttribute('aria-expanded',String(next)); if (next) { setTimeout(() => input.focus(),280); scrollBottom(); } else { hideClearConfirm(); setTimeout(() => launcher.focus(),0); } }
  function scrollBottom() { messages.scrollTop = messages.scrollHeight; } function resizeInput() { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight,120)}px`; } function setProcessing(next) { processing = next; sendButton.disabled = next; input.disabled = next; typing.classList.toggle('is-visible',next); if (next) scrollBottom(); } function showError(message) { errorText.textContent = message; error.classList.add('is-visible'); } function hideError() { error.classList.remove('is-visible'); } function timestamp() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
  function addMessage(role,content) { const welcomeNode = $('loliWelcome'); if (welcomeNode) welcomeNode.remove(); const message = document.createElement('article'); message.className = `loli-message loli-message--${role}`; const group = document.createElement('div'); group.className = 'loli-message__group'; if (role === 'assistant') { const avatar = document.createElement('span'); avatar.className = 'loli-message__avatar'; const image = document.createElement('img'); image.src = '/public/photos/loli-logo.png'; image.alt = 'Loli'; avatar.appendChild(image); group.appendChild(avatar); } const contentBlock = document.createElement('div'), bubble = document.createElement('div'), time = document.createElement('div'); bubble.className = 'loli-message__bubble'; bubble.textContent = String(content || ''); time.className = 'loli-message__time'; time.textContent = timestamp(); contentBlock.append(bubble,time); group.appendChild(contentBlock); message.appendChild(group); messages.appendChild(message); scrollBottom(); }
  async function send(command = input.value.trim()) { if (!command || processing) return; addMessage('user',command); input.value = ''; resizeInput(); hideError(); setProcessing(true); try { const response = await fetch('/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})}); const data = await response.json().catch(() => ({})); if (data.success) addMessage('assistant',data.message); else { const message = data.message || data.error || 'Loli could not process that request. Try again.'; showError(message); addMessage('assistant',message); } } catch (requestError) { const message = 'Couldn’t reach the AI service. Check your connection and try again.'; showError(message); addMessage('assistant',message); } finally { setProcessing(false); input.focus(); } }
  function showClearConfirm() { if (processing) return; clearModal.classList.add('is-visible'); clearModal.setAttribute('aria-hidden','false'); setTimeout(() => cancelClear.focus(),0); } function hideClearConfirm() { clearModal.classList.remove('is-visible'); clearModal.setAttribute('aria-hidden','true'); }
  async function clearConversation() { confirmClear.disabled = true; cancelClear.disabled = true; try { const response = await fetch('/api/agent/clear',{method:'POST'}); const data = await response.json().catch(() => ({})); if (!response.ok || !data.success) throw new Error(data.error || data.message || 'Could not clear the conversation.'); welcome(); hideError(); hideClearConfirm(); } catch (clearError) { hideClearConfirm(); showError(clearError.message || 'Could not clear the conversation.'); } finally { confirmClear.disabled = false; cancelClear.disabled = false; clearButton.focus(); } }
  launcher.addEventListener('click',() => setOpen(true)); $('loliCloseButton').addEventListener('click',() => setOpen(false)); $('loliComposer').addEventListener('submit',(event) => { event.preventDefault(); send(); }); input.addEventListener('input',resizeInput); input.addEventListener('keydown',(event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); } }); document.querySelector('.loli-widget').addEventListener('click',(event) => { const button = event.target.closest('[data-command]'); if (button) send(button.dataset.command); }); clearButton.addEventListener('click',showClearConfirm); cancelClear.addEventListener('click',() => { hideClearConfirm(); clearButton.focus(); }); confirmClear.addEventListener('click',clearConversation); document.addEventListener('keydown',(event) => { if (event.key === 'Escape') { if (clearModal.classList.contains('is-visible')) { hideClearConfirm(); clearButton.focus(); } else if (open) setOpen(false); } }); welcome(); resizeInput();
})();
</script>
