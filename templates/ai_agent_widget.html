<aside class="loli-widget" id="loliWidget" aria-label="Loli AI assistant">
  <div class="loli-shell" id="loliShell">
    <button class="loli-toggle" id="loliToggle" type="button" aria-label="Open Loli assistant" aria-expanded="false" aria-controls="loliPanel"><span class="loli-toggle__icon" id="loliToggleIcon"><img src="/public/photos/loli-logo.png" alt=""></span><span class="loli-toggle__text" id="loliToggleText">Ask Loli</span></button>

      <div class="loli-toolbar"><button class="loli-drag-handle" id="loliDragHandle" type="button" aria-label="Drag chat window" title="Drag to move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/></svg>Move</button><span id="loliTitle">Loli assistant</span><span class="loli-toolbar__actions"><button id="loliClear" type="button" aria-label="Clear conversation" title="Clear conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-7 0 1 14h4l1-14"/></svg></button></span></div>

      <div class="loli-typing" id="loliTyping" aria-live="polite"><span class="loli-dots" aria-hidden="true"><span></span><span></span><span></span></span>Loli is thinking…</div>

    </section>
  </div>
</aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id), widget = $('loliWidget'), shell = $('loliShell'), toggle = $('loliToggle'), toggleIcon = $('loliToggleIcon'), toggleText = $('loliToggleText'), panel = $('loliPanel'), input = $('loliInput'), messages = $('loliMessages'), send = $('loliSend'), typing = $('loliTyping'), error = $('loliError'), errorText = $('loliErrorText'), confirm = $('loliConfirm'), clear = $('loliClear'), cancelClear = $('loliCancelClear'), confirmClear = $('loliConfirmClear'), dragHandle = $('loliDragHandle');

  function addMessage(role,content) { const welcomeNode = $('loliWelcome'); if (welcomeNode) welcomeNode.remove(); const item = document.createElement('article'); item.className = `loli-message loli-message--${role}`; const wrap = document.createElement('div'); wrap.className = 'loli-message__wrap'; const bubble = document.createElement('div'); bubble.className = 'loli-message__bubble'; bubble.textContent = String(content || ''); const time = document.createElement('div'); time.className = 'loli-message__time'; time.textContent = timestamp(); wrap.append(bubble,time); item.appendChild(wrap); messages.appendChild(item); scrollBottom(); }
  function setOpen(next) { isOpen = next; shell.classList.toggle('is-open',next); toggle.setAttribute('aria-expanded',String(next)); toggle.setAttribute('aria-label',next ? 'Close Loli assistant' : 'Open Loli assistant'); panel.setAttribute('aria-hidden',String(!next)); toggleIcon.innerHTML = next ? closeIcon : '<img src="/public/photos/loli-logo.png" alt="">'; toggleText.textContent = next ? 'Close' : 'Ask Loli'; if (next) setTimeout(() => { if (!isMobile() && widget.style.left) applyPosition({left:widget.style.left,top:widget.style.top}); input.focus(); },460); else setTimeout(() => toggle.focus(),0); }

  function clampPosition(left,top) { const rect = widget.getBoundingClientRect(), margin = 8; return { left: Math.max(margin,Math.min(left,window.innerWidth - rect.width - margin)), top: Math.max(margin,Math.min(top,window.innerHeight - rect.height - margin)) }; }

  function onDragMove(event) { if (!drag) return; const point = clampPosition(drag.left + event.clientX - drag.x,drag.top + event.clientY - drag.y); if (Math.abs(event.clientX-drag.x) > 3 || Math.abs(event.clientY-drag.y) > 3) drag.moved = true; widget.style.left = `${point.left}px`; widget.style.top = `${point.top}px`; widget.style.right = 'auto'; widget.style.bottom = 'auto'; }
  function onDragEnd(event) { if (!drag) return; if (dragHandle.hasPointerCapture(event.pointerId)) dragHandle.releasePointerCapture(event.pointerId); if (drag.moved) localStorage.setItem(storageKey,JSON.stringify({left:parseFloat(widget.style.left),top:parseFloat(widget.style.top)})); drag = null; }
  toggle.addEventListener('click',() => setOpen(!isOpen)); $('loliComposer').addEventListener('submit',(event) => { event.preventDefault(); sendMessage(); }); input.addEventListener('input',resizeInput); input.addEventListener('keydown',(event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } }); widget.addEventListener('click',(event) => { const button = event.target.closest('[data-command]'); if (button) sendMessage(button.dataset.command); }); clear.addEventListener('click',showConfirm); cancelClear.addEventListener('click',() => { hideConfirm(); clear.focus(); }); confirmClear.addEventListener('click',clearChat); document.addEventListener('keydown',(event) => { if (event.key === 'Escape') { if (confirm.classList.contains('is-visible')) { hideConfirm(); clear.focus(); } else if (isOpen) setOpen(false); } }); dragHandle.addEventListener('pointerdown',onDragStart); dragHandle.addEventListener('pointermove',onDragMove); dragHandle.addEventListener('pointerup',onDragEnd); dragHandle.addEventListener('pointercancel',onDragEnd); window.addEventListener('resize',() => { if (!isMobile() && widget.style.left) applyPosition({left:widget.style.left,top:widget.style.top}); });

</script>
