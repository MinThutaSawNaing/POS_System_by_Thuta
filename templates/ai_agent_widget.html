<!-- Loli Workspace: native POS assistant with a movable Android-style chat head. -->
<style>

  .loli-confirm { position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(255,255,255,.78); backdrop-filter:blur(2px); }.loli-confirm.is-visible { display:flex; }.loli-confirm__card { width:100%; max-width:288px; padding:17px; border:1px solid var(--loli-border); border-radius:13px; background:#fff; box-shadow:0 12px 30px rgba(31,41,55,.16); }.loli-confirm h3 { margin:0 0 5px; font-size:15px; font-weight:700; }.loli-confirm p { margin:0; color:var(--loli-muted); font-size:12px; line-height:1.45; }.loli-confirm__actions { display:flex; justify-content:flex-end; gap:7px; margin-top:15px; }.loli-confirm__actions button { min-height:32px; padding:0 11px; border-radius:7px; cursor:pointer; font-size:12px; font-weight:700; }.loli-cancel { border:1px solid var(--loli-border); background:#fff; color:#44505f; }.loli-delete { border:1px solid var(--loli-danger); background:var(--loli-danger); color:#fff; }

</style>

<aside class="loli-workspace" id="loliWorkspace" aria-label="Loli AI assistant">
  <button class="loli-chat-head" id="loliChatHead" type="button" aria-label="Open Loli assistant" aria-expanded="false" aria-controls="loliPanel"><img src="/public/photos/loli-logo.png" alt="Loli AI"><span class="loli-chat-head__unread" id="loliUnread" aria-label="New Loli response"></span></button>

    <div class="loli-menu" id="loliMenu" role="menu"><button id="loliClear" type="button" role="menuitem">Clear conversation</button><button id="loliResetPosition" type="button" role="menuitem">Reset chat-head position</button></div>

    <main class="loli-messages" id="loliMessages" aria-live="polite" aria-relevant="additions"></main>
    <div class="loli-typing" id="loliTyping" aria-live="polite"><span class="loli-dots" aria-hidden="true"><span></span><span></span><span></span></span>Loli is thinking…</div>
    <form class="loli-composer" id="loliComposer"><div class="loli-input-row"><textarea id="loliInput" rows="1" maxlength="4000" aria-label="Message Loli" placeholder="Ask about stock, suppliers, or sales…"></textarea><button class="loli-send" id="loliSend" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><small class="loli-hint">Enter to send · Shift + Enter for a new line</small></form>

  </section>
</aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id), workspace = $('loliWorkspace'), head = $('loliChatHead'), panel = $('loliPanel'), input = $('loliInput'), messages = $('loliMessages'), send = $('loliSend'), typing = $('loliTyping'), error = $('loliError'), errorText = $('loliErrorText'), unread = $('loliUnread'), menu = $('loliMenu'), menuButton = $('loliMenuButton'), confirm = $('loliConfirm'), clear = $('loliClear'), cancelClear = $('loliCancelClear'), confirmClear = $('loliConfirmClear'), resetPosition = $('loliResetPosition');

  function addMessage(role,content) { const welcomeNode = $('loliWelcome'); if (welcomeNode) welcomeNode.remove(); const article = document.createElement('article'); article.className = `loli-message loli-message--${role}`; const wrap = document.createElement('div'); wrap.className = 'loli-message__wrap'; if (role === 'assistant') { const label = document.createElement('span'); label.className = 'loli-message__label'; label.textContent = 'Loli'; wrap.appendChild(label); } const bubble = document.createElement('div'); bubble.className = 'loli-message__bubble'; bubble.textContent = String(content || ''); const time = document.createElement('div'); time.className = 'loli-message__time'; time.textContent = now(); wrap.append(bubble,time); article.appendChild(wrap); messages.appendChild(article); scrollBottom(); }

  async function sendMessage(command = input.value.trim()) { if (!command || processing) return; addMessage('user',command); input.value = ''; resizeInput(); hideError(); setProcessing(true); try { const response = await fetch('/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})}); const data = await response.json().catch(() => ({})); if (data.success) { addMessage('assistant',data.message); if (!isOpen) unread.classList.add('is-visible'); } else { const message = data.message || data.error || 'Loli could not process that request.'; showError(message); addMessage('assistant',message); } } catch (requestError) { const message = 'Couldn’t reach the AI service. Check your connection and try again.'; showError(message); addMessage('assistant',message); } finally { setProcessing(false); if (isOpen) input.focus(); } }
  function hideMenu() { menu.classList.remove('is-open'); menuButton.setAttribute('aria-expanded','false'); } function toggleMenu() { const open = !menu.classList.contains('is-open'); menu.classList.toggle('is-open',open); menuButton.setAttribute('aria-expanded',String(open)); }
  function showConfirm() { hideMenu(); if (processing) return; confirm.classList.add('is-visible'); confirm.setAttribute('aria-hidden','false'); cancelClear.focus(); } function hideConfirm() { confirm.classList.remove('is-visible'); confirm.setAttribute('aria-hidden','true'); }
  async function clearChat() { confirmClear.disabled = true; try { const response = await fetch('/api/agent/clear',{method:'POST'}); const data = await response.json().catch(() => ({})); if (!response.ok || !data.success) throw new Error(data.error || 'Could not clear the conversation.'); welcome(); hideError(); hideConfirm(); } catch (clearError) { hideConfirm(); showError(clearError.message || 'Could not clear the conversation.'); } finally { confirmClear.disabled = false; clear.focus(); } }

  function dragStart(event) { if (event.button !== undefined && event.button !== 0 || isOpen) return; const rect = workspace.getBoundingClientRect(); drag = {startX:event.clientX,startY:event.clientY,left:rect.left,top:rect.top,moved:false}; head.classList.add('is-dragging'); head.setPointerCapture(event.pointerId); event.preventDefault(); }
  function dragMove(event) { if (!drag) return; const dx = event.clientX - drag.startX, dy = event.clientY - drag.startY; if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true; const y = clampY(drag.top + dy); const x = Math.max(margin,Math.min(drag.left + dx,window.innerWidth - headSize - margin)); workspace.style.top = `${y}px`; workspace.style.left = `${x}px`; workspace.style.right = 'auto'; }
  function dragEnd(event) { if (!drag) return; if (head.hasPointerCapture(event.pointerId)) head.releasePointerCapture(event.pointerId); head.classList.remove('is-dragging'); const point = currentPosition(); placeHead(point,true); const wasMoved = drag.moved; drag = null; if (!wasMoved) setOpen(!isOpen); }
  head.addEventListener('pointerdown',dragStart); head.addEventListener('pointermove',dragMove); head.addEventListener('pointerup',dragEnd); head.addEventListener('pointercancel',dragEnd); head.addEventListener('keydown',(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setOpen(!isOpen); } }); $('loliClose').addEventListener('click',() => setOpen(false)); menuButton.addEventListener('click',toggleMenu); clear.addEventListener('click',showConfirm); resetPosition.addEventListener('click',resetHead); cancelClear.addEventListener('click',() => { hideConfirm(); clear.focus(); }); confirmClear.addEventListener('click',clearChat); $('loliComposer').addEventListener('submit',(event) => { event.preventDefault(); sendMessage(); }); input.addEventListener('input',resizeInput); input.addEventListener('keydown',(event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } }); workspace.addEventListener('click',(event) => { const prompt = event.target.closest('[data-command]'); if (prompt) sendMessage(prompt.dataset.command); }); document.addEventListener('pointerdown',(event) => { if (!workspace.contains(event.target)) hideMenu(); }); document.addEventListener('keydown',(event) => { if (event.key === 'Escape') { if (confirm.classList.contains('is-visible')) { hideConfirm(); clear.focus(); } else if (menu.classList.contains('is-open')) hideMenu(); else if (isOpen) setOpen(false); } }); window.addEventListener('resize',() => { if (mobile() && isOpen) { workspace.classList.add('is-mobile-open'); } else { if (workspace.classList.contains('is-mobile-open')) { workspace.classList.remove('is-mobile-open'); restorePosition(); } else placeHead(currentPosition(),false); if (isOpen) placePanel(); } });
  welcome(); resizeInput(); restorePosition();
})();
</script>
