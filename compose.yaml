name: parrot-pos

services:
  app:
    build:
      context: .
    image: parrot-pos:latest
    container_name: parrot-pos
    restart: unless-stopped
    init: true
    ports:
      - "${POS_BIND_ADDRESS:-127.0.0.1}:${POS_PORT:-8888}:8888"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting the service}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-}"
      AI_MAX_ACTIVE_SESSIONS: "${AI_MAX_ACTIVE_SESSIONS:-16}"
      AI_MAX_HISTORY_MESSAGES: "${AI_MAX_HISTORY_MESSAGES:-30}"
      AI_MEMORY_ENABLED: "${AI_MEMORY_ENABLED:-false}"
      AI_MEMORY_MAX_RESULTS: "${AI_MEMORY_MAX_RESULTS:-5}"
      AI_MEMORY_MAX_CONTEXT_CHARS: "${AI_MEMORY_MAX_CONTEXT_CHARS:-1500}"
      AI_MEMORY_MEM0_CONFIG: "${AI_MEMORY_MEM0_CONFIG:-}"
      # Vendor-only master credential that unlocks user creation. Values are
      # sourced from .env (never committed); only the password hash is stored.
      POS_ACCOUNT_BARRIER_USERNAME: "${POS_ACCOUNT_BARRIER_USERNAME:-}"
      POS_ACCOUNT_BARRIER_PASSWORD: "${POS_ACCOUNT_BARRIER_PASSWORD:-}"
      MMPAY_ENABLED: "${MMPAY_ENABLED:-false}"
      MMPAY_APP_ID: "${MMPAY_APP_ID:-}"
      MMPAY_PUBLISHABLE_KEY: "${MMPAY_PUBLISHABLE_KEY:-}"
      MMPAY_SECRET_KEY: "${MMPAY_SECRET_KEY:-}"
      MMPAY_API_BASE_URL: "${MMPAY_API_BASE_URL:-}"
      MMPAY_CALLBACK_URL: "${MMPAY_CALLBACK_URL:-}"
    volumes:
      - type: volume
        source: pos_instance
        target: /app/instance
      - type: volume
        source: pos_uploads
        target: /app/uploads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 384m
    memswap_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pos_instance:
  pos_uploads: